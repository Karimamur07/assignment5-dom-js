<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment 5 - JavaScript DOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Assignment 5: JavaScript DOM & Events</h1>

   <form id="profile-form">
    
    <label for="username">Username:</label>
    <input type="text" id="username" placeholder="Enter your name" required>

    
    <label for="birth-year">Birth Year:</label>
    <input type="number" id="birth-year" placeholder="e.g. 2005" required>

    
    <button type="submit" id="update-btn">Create / Update Profile</button>
  </form>


  <div id="profile-info">
  </div>
  
  <section>
    <h2>My Hobbies List</h2>
    
    <input type="text" id="hobby-input" placeholder="Enter a new hobby">
    
    <button type="button" id="add-btn">Add Item</button>
    <button type="button" id="remove-btn">Remove Item</button>

    <ul id="hobby-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
